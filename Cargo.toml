[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/xgodev/jovee-ruler"

[workspace.dependencies]
jr-core = { path = "crates/jr-core" }
jr-gui = { path = "crates/jr-gui" }
jovee-theme = { git = "ssh://git@github.com/xgodev/jovee-theme.git", branch = "main" }
slint = "=1.18.1"
resvg = { version = "=0.48.1", default-features = false }
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
serde_yaml = "0.9"
sys-locale = "0.3"
tempfile = "3"
